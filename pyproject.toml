[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "aegisx-orchestrator"
version         = "0.1.0"
description     = "AEGISX Sentinel – multi-agent orchestration and MCP server"
requires-python = ">=3.10"
dependencies    = [
    "pydantic>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
llm  = ["google-generativeai>=0.8"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
aegisx-mcp = "aegisx_orchestrator.mcp_server.server:run_mcp_server"

[tool.setuptools.packages.find]
include = ["aegisx_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
